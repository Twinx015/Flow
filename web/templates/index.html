<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flow</title>
        <link rel="icon" type="image/x-icon" href="/static/Logo.png">
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <aside id="sidebar">
            <div class="sidebar-header">
                <span class="logo">FLOW</span>
                <button id="settingsBtn" class="icon-btn" title="Settings">
                    <i class="bi bi-gear"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-panel="home">
                    <i class="bi bi-house"></i><span>Home</span>
                </button>
                <button class="nav-item" data-panel="explore">
                    <i class="bi bi-compass"></i><span>Explore</span>
                </button>
                <button class="nav-item" data-panel="local">
                    <i class="bi bi-hdd"></i><span>Local</span>
                </button>
                <button class="nav-item" data-panel="liked">
                    <i class="bi bi-heart"></i><span>Liked</span>
                </button>
                <button class="nav-item" data-panel="queue">
                    <i class="bi bi-list-ul"></i><span>Queue</span>
                </button>
                <button class="nav-item" data-panel="history">
                    <i class="bi bi-clock-history"></i><span>History</span>
                </button>
            </nav>
            <hr class="sidebar-divider" />
            <div class="sidebar-section-header">
                <span>Playlists</span>
                <div class="sidebar-section-actions">
                    <button
                        id="importPlaylistBtn"
                        class="icon-btn-sm"
                        title="Import M3U playlist"
                    >
                        <i class="bi bi-box-arrow-in-down"></i>
                    </button>
                    <button
                        id="newPlaylistBtn"
                        class="icon-btn-sm"
                        title="New playlist"
                    >
                        <i class="bi bi-plus-lg"></i>
                    </button>
                </div>
            </div>
            <input
                id="importPlaylistFile"
                type="file"
                accept=".m3u,.m3u8,audio/x-mpegurl,text/plain"
                class="hidden"
            />
            <div id="sidebarPlaylists" class="sidebar-playlists"></div>
        </aside>

        <main id="mainContent">
            <header id="contentHeader">
                <div class="search-wrap">
                    <i class="bi bi-search search-icon"></i>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search..."
                        autocomplete="off"
                    />
                    <div class="src-toggle">
                        <button
                            id="srcYt"
                            class="src-btn active"
                            data-source="youtube"
                            title="YouTube"
                        >
                            <i class="bi bi-youtube"></i>
                        </button>
                        <button
                            id="srcLocal"
                            class="src-btn"
                            data-source="local"
                            title="Local"
                        >
                            <i class="bi bi-hdd"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div id="panelHome" class="panel">
                <div id="lastPlayedSection" class="home-section"></div>
                <div class="home-section">
                    <div class="home-section-title">
                        <i class="bi bi-stars"></i> Speed Dial
                    </div>
                    <div id="speedDialGrid" class="card-grid"></div>
                </div>
            </div>

            <div class="panel" id="panelExplore">
                <div id="exploreSections"></div>
            </div>

            <div class="panel" id="panelSearch">
                <div id="ytmFilters" class="ytm-filters">
                    <button class="filt-chip active" data-filter="">
                        All
                    </button>
                    <button class="filt-chip" data-filter="songs">Songs</button>
                    <button class="filt-chip" data-filter="videos">Videos</button>
                    <button class="filt-chip" data-filter="albums">Albums</button>
                    <button class="filt-chip" data-filter="artists">Artists</button>
                    <button class="filt-chip" data-filter="playlists">Playlists</button>
                    <button class="filt-chip" data-filter="community">Community</button>
                </div>
                <div id="resultsContainer" class="song-list"></div>
            </div>

            <div class="panel" id="panelLocal">
                <div class="panel-toolbar">
                    <button id="localShuffleBtn" class="tool-btn">
                        <i class="bi bi-shuffle"></i> Shuffle
                    </button>
                    <button id="scanLocalBtn" class="tool-btn">
                        <i class="bi bi-arrow-clockwise"></i> Scan
                    </button>
                </div>
                <div id="albumsGrid" class="card-grid"></div>
                <div id="albumSongs" class="song-list"></div>
                <div id="localSongs" class="song-list"></div>
            </div>

            <div class="panel" id="panelLiked">
                <div class="panel-toolbar">
                    <button id="refreshLikedBtn" class="tool-btn">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div id="likedSongs" class="song-list"></div>
            </div>

            <div class="panel" id="panelQueue">
                <div class="panel-toolbar">
                    <label class="check-label"
                        ><input type="checkbox" id="autoPlayToggle" checked />
                        Auto-play</label
                    >
                    <button id="clearQueueBtn" class="tool-btn">
                        <i class="bi bi-trash"></i> Clear
                    </button>
                    <button id="saveQueueBtn" class="tool-btn">
                        <i class="bi bi-floppy"></i> Save
                    </button>
                </div>
                <div id="queueContainer" class="song-list"></div>
            </div>

            <div class="panel" id="panelHistory">
                <div class="panel-toolbar">
                    <span class="tool-label">Sort</span>
                    <select id="historySort" class="tool-select">
                        <option value="recent">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="most">Most played</option>
                        <option value="least">Least played</option>
                    </select>
                    <span class="tool-label">Range</span>
                    <select id="historyRange" class="tool-select">
                        <option value="all">All time</option>
                        <option value="30d">Last 30 days</option>
                        <option value="7d">Last 7 days</option>
                        <option value="today">Today</option>
                    </select>
                    <label class="check-label"
                        ><input type="checkbox" id="historyUnique" /> Unique
                        songs</label
                    >
                    <button id="refreshHistoryBtn" class="tool-btn">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                    <button id="clearHistoryBtn" class="tool-btn">
                        <i class="bi bi-trash"></i> Clear
                    </button>
                </div>
                <div id="historySummary" class="history-summary"></div>
                <div id="historyContainer" class="song-list"></div>
            </div>

            <div class="panel" id="panelPlaylistDetail">
                <div id="playlistDetailContent" class="song-list"></div>
            </div>

            <div class="panel" id="panelBrowse">
                <div id="browseHead"></div>
                <div id="browseSongs" class="song-list"></div>
                <div id="browseExtra" class="browse-extra"></div>
            </div>
        </main>

        <footer id="playerBar">
            <div id="playerBarBg"></div>
            <div class="pb-left">
                <img id="playerArt" src="/static/Logo.png" alt="" />
                <div class="pb-info">
                    <span id="playerTitle" class="pb-title">Flow Music</span>
                    <span id="playerArtist" class="pb-artist"></span>
                </div>
            </div>
            <div class="pb-center">
                <div class="pb-controls">
                    <button id="shuffleBtn" class="ctrl-btn" title="Shuffle">
                        <i class="bi bi-shuffle"></i>
                    </button>
                    <button id="prevBtn" class="ctrl-btn" title="Previous">
                        <i class="bi bi-skip-start-fill"></i>
                    </button>
                    <button
                        id="playBtn"
                        class="ctrl-btn play-btn"
                        title="Play/Pause"
                    >
                        <i class="bi bi-play-fill"></i>
                    </button>
                    <button id="nextBtn" class="ctrl-btn" title="Next">
                        <i class="bi bi-skip-end-fill"></i>
                    </button>
                    <button id="repeatBtn" class="ctrl-btn" title="Repeat">
                        <i class="bi bi-repeat"></i>
                    </button>
                </div>
                <div class="pb-progress">
                    <span id="currentTime" class="time-label">0:00</span>
                    <div id="progressBar" class="progress-track">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    <span id="totalTime" class="time-label">0:00</span>
                </div>
            </div>
            <div class="pb-right">
                <button id="fsOpenBtn" class="ctrl-btn" title="Full screen (f)">
                    <i class="bi bi-arrows-fullscreen"></i>
                </button>
                <button id="lyricsBtn" class="ctrl-btn" title="Lyrics (l)">
                    <i class="bi bi-text-paragraph"></i>
                </button>
                <button id="likeBtn" class="ctrl-btn" title="Like">
                    <i class="bi bi-heart"></i>
                </button>
                <button id="downloadBtn" class="ctrl-btn" title="Download">
                    <i class="bi bi-download"></i>
                </button>
                <div class="vol-group">
                    <i class="bi bi-volume-up vol-icon"></i>
                    <input
                        type="range"
                        id="volumeSlider"
                        min="0"
                        max="100"
                        value="80"
                    />
                </div>
            </div>
        </footer>

        <div id="fsPlayer" class="modal-overlay fs-player" tabindex="-1">
            <button id="fsCloseBtn" class="icon-btn fs-close" title="Close (Esc)">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="fs-grid">
                <section class="fs-left">
                    <img id="fsArt" class="fs-art" src="/static/Logo.png" alt="" />
                    <div class="fs-meta">
                        <span id="fsTag" class="browse-tag">Now Playing</span>
                        <h2 id="fsTitle" class="fs-title">Flow Music</h2>
                        <span id="fsArtist" class="fs-artist"></span>
                    </div>
                    <div class="fs-progress">
                        <span id="fsCur" class="time-label">0:00</span>
                        <div id="fsBar" class="progress-track">
                            <div id="fsFill" class="progress-fill"></div>
                        </div>
                        <span id="fsTot" class="time-label">0:00</span>
                    </div>
                    <div class="fs-controls">
                        <button id="fsShuffleBtn" class="ctrl-btn" title="Shuffle">
                            <i class="bi bi-shuffle"></i>
                        </button>
                        <button id="fsPrevBtn" class="ctrl-btn" title="Previous">
                            <i class="bi bi-skip-start-fill"></i>
                        </button>
                        <button id="fsPlayBtn" class="ctrl-btn play-btn" title="Play/Pause">
                            <i class="bi bi-play-fill"></i>
                        </button>
                        <button id="fsNextBtn" class="ctrl-btn" title="Next">
                            <i class="bi bi-skip-end-fill"></i>
                        </button>
                        <button id="fsRepeatBtn" class="ctrl-btn" title="Repeat">
                            <i class="bi bi-repeat"></i>
                        </button>
                        <button id="fsLikeBtn" class="ctrl-btn" title="Like">
                            <i class="bi bi-heart"></i>
                        </button>
                    </div>
                </section>
                <aside class="fs-right">
                    <div class="fs-lyrics-head">
                        <span class="browse-tag">LYRICS</span>
                        <span id="fsLyricsSource" class="lyrics-source"></span>
                        <button id="fsReloadLyricsBtn" class="icon-btn" title="Reload">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div id="fsLyricsBody" class="fs-lyrics-body"></div>
                </aside>
            </div>
        </div>

        <div id="settingsModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-head">
                    <h2><i class="bi bi-gear"></i> Settings</h2>
                    <button id="closeSettings" class="icon-btn">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label><i class="bi bi-palette"></i> Theme</label>
                        <select id="setTheme">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                    <div class="field">
                        <label
                            ><i class="bi bi-eyedropper"></i> Background
                            Blur</label
                        >
                        <input
                            type="range"
                            id="setBgBlur"
                            min="0"
                            max="30"
                            value="0"
                        />
                    </div>
                    <div class="field">
                        <label><i class="bi bi-moon"></i> Background Dim</label>
                        <input
                            type="range"
                            id="setBgDim"
                            min="0"
                            max="100"
                            value="80"
                        />
                    </div>
                    <div class="field">
                        <label><i class="bi bi-volume-up"></i> Volume</label>
                        <input
                            type="range"
                            id="setVolume"
                            min="0"
                            max="100"
                            value="80"
                        />
                    </div>
                    <div class="field">
                        <label
                            ><i class="bi bi-broadcast"></i> Default
                            Source</label
                        >
                        <select id="setDefaultSource">
                            <option value="youtube">YouTube</option>
                            <option value="local">Local</option>
                        </select>
                    </div>
                    <div class="field">
                        <label
                            ><i class="bi bi-folder"></i> Download Path</label
                        >
                        <input
                            type="text"
                            id="setDownloadPath"
                            value="~/.flow/downloads"
                        />
                    </div>
                    <div class="field">
                        <label
                            ><i class="bi bi-file-earmark-music"></i> Download
                            Format</label
                        >
                        <select id="setDownloadFormat">
                            <option value="webm">WebM</option>
                            <option value="opus">Opus</option>
                            <option value="m4a">M4A</option>
                            <option value="mp3">MP3</option>
                        </select>
                    </div>
                    <div class="field check-field">
                        <label
                            ><input type="checkbox" id="setMiniOnBlur" />
                            Minimize on blur</label
                        >
                    </div>
                </div>
                <div class="modal-foot">
                    <button id="resetSettings" class="tool-btn">
                        <i class="bi bi-arrow-clockwise"></i> Reset
                    </button>
                    <button id="saveSettings" class="tool-btn primary">
                        <i class="bi bi-check-lg"></i> Save
                    </button>
                </div>
            </div>
        </div>

        <div id="lyricsModal" class="modal-overlay">
            <div class="modal lyrics-modal">
                <div class="modal-head">
                    <h2><i class="bi bi-text-paragraph"></i> Lyrics</h2>
                    <div class="lyrics-head-right">
                        <span id="lyricsSource" class="lyrics-source"></span>
                        <button id="reloadLyricsBtn" class="icon-btn" title="Reload">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                        <button id="closeLyrics" class="icon-btn">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
                <div class="lyrics-meta">
                    <input id="lyricsQuery" class="lyrics-input" type="text"
                           spellcheck="false" autocomplete="off"
                           placeholder="Song name for lyrics…" />
                    <button id="lyricsSearchBtn" class="icon-btn" title="Search lyrics">
                        <i class="bi bi-search"></i>
                    </button>
                    <span id="lyricsSourceMode" class="lyrics-tag"></span>
                </div>
                <div id="lyricsBody" class="lyrics-body"></div>
            </div>
        </div>

        <div id="playlistModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-head">
                    <h2 id="playlistModalTitle">
                        <i class="bi bi-list-ul"></i> Save as Playlist
                    </h2>
                    <button id="closePlaylistModal" class="icon-btn">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label><i class="bi bi-fonts"></i> Playlist Name</label>
                        <input
                            type="text"
                            id="playlistNameInput"
                            placeholder="My Playlist"
                            maxlength="60"
                        />
                    </div>
                </div>
                <div class="modal-foot">
                    <button id="savePlaylistBtn" class="tool-btn primary">
                        <i class="bi bi-check-lg"></i> Save
                    </button>
                </div>
            </div>
        </div>

        <div id="playlistExistsModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-head">
                    <h2><i class="bi bi-exclamation-triangle"></i></h2>
                    <button id="closeExistsModal" class="icon-btn">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <p id="existsMsg"></p>
                </div>
                <div class="modal-foot">
                    <button id="existsAppendBtn" class="tool-btn">
                        Append
                    </button>
                    <button id="existsOverwriteBtn" class="tool-btn primary">
                        Overwrite
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast"></div>
        <audio id="audioPlayer" preload="metadata"></audio>
        <script src="/static/script.js"></script>
    </body>
</html>
