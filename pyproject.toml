[project]
name = "flow-twinx"
version = "0.10.2"
description = "A terminal music player with online and offline modes songs sourced from youtube."
readme = "README.md"
requires-python = ">=3.14"
dynamic = []
dependencies = [
    "dbus-fast>=5.0.22",
    "dbus-python>=1.4.0; sys_platform == 'linux'",
    "pygobject>=3.58.0; sys_platform == 'linux'",
    "flask",
    "numpy",
    "psutil>=7.2.2",
    "python-vlc",
    "questionary",
    "rich>=13.7.0",
    "sounddevice",
    "textual>=8.2.8",
    "tile-twinx>=1.0.1",
    "yt-dlp>=2026.8.19",
    "ytmusicapi",
    "keyring>=25.7.0",
    "cryptography>=50.0.2",
]

keywords = [
    "youtube",
    "music",
    "cli",
    "tui",
    "web",
    "musicplayer",
    "youtube-client",
    "flow",
]

[project.scripts]
flow = "cli.main:main"
flow-tui = "tui:main"
flow-web = "web.main:main"
flow-min = "minimal.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "backend*", "minimal*", "tui*", "web*"]

[tool.setuptools.package-data]
flow_twinx = ["Hyprland/*.qml"]
web = ["templates/*"]
cli = ["banners/*.txt"]

[dependency-groups]
dev = ["pyinstaller>=6.21.0", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
