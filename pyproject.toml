[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-twinx"
version = "0.5.3"
description = "A terminal music player with online and offline modes"
readme = "README.md"
requires-python = ">=3.14"
dynamic = []
dependencies = [
    "flask",
    "numpy",
    "psutil>=7.2.2",
    "python-vlc",
    "sounddevice",
    "toml>=0.10.2",
    "yt_dlp",
    "ytmusicapi",
]

[project.scripts]
flow = "flow_twinx.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flow_twinx*"]

[tool.setuptools.package-data]
flow_twinx = ["web/templates/*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[project.urls]
Homepage = "https://github.com/philast-015/flow/"
Issues = "https://github.com/philast-015/flow/issues"
